repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Версии запинены под poetry.lock: иначе CI ставит свежую SQLAlchemy, которую
    # старый mypy не понимает (Mapped[...] → Column[...]), и даёт десятки ложных ошибок.
    rev: v1.20.2
    hooks:
      - id: mypy
        exclude: ^alembic/
        additional_dependencies:
          - sqlalchemy==2.0.51
          - pydantic==2.13.4
          - types-requests
          - boto3-stubs[s3]==1.43.42
          - bcrypt==4.3.0
